name: service-center-replication

services:
  primary:
    image: postgres:17-bookworm
    container_name: service-center-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      REPLICATION_USER: ${REPLICATION_USER:?Set REPLICATION_USER in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
      APPLICATION_USER: ${APPLICATION_USER:?Set APPLICATION_USER in .env}
      APPLICATION_PASSWORD: ${APPLICATION_PASSWORD:?Set APPLICATION_PASSWORD in .env}
      ANALYST_USER: ${ANALYST_USER:?Set ANALYST_USER in .env}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hot_standby=on
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${PRIMARY_PORT:-55432}:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/course/sql:ro
      - ../../migrations:/course/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - database_network

  replica:
    image: postgres:17-bookworm
    container_name: service-center-replica
    entrypoint:
      - /bin/sh
      - /usr/local/bin/replica-entrypoint.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      PRIMARY_HOST: primary
      PRIMARY_DB_PORT: 5432
      REPLICATION_USER: ${REPLICATION_USER:?Set REPLICATION_USER in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
      REPLICA_APPLICATION_NAME: service_center_replica
    ports:
      - "127.0.0.1:${REPLICA_PORT:-55433}:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./replica/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
      - ./sql:/course/sql:ro
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && [ "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT pg_is_in_recovery()')" = "t" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - database_network

  restore:
    image: postgres:17-bookworm
    container_name: service-center-restore
    profiles:
      - restore
    environment:
      POSTGRES_DB: ${RESTORE_DB:-service_center_restored}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${RESTORE_ADMIN_PASSWORD:?Set RESTORE_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    ports:
      - "127.0.0.1:${RESTORE_PORT:-55434}:5432"
    volumes:
      - restore_data:/var/lib/postgresql/data
      - ./sql:/course/sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - database_network

volumes:
  primary_data:
    name: service_center_primary_data
  replica_data:
    name: service_center_replica_data
  restore_data:
    name: service_center_restore_data

networks:
  database_network:
    name: service_center_database_network
